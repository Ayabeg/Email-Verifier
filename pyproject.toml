[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-verifier"
version = "0.1.0"
description = "A conservative, testable email verification engine and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ayabeg" }]
dependencies = ["dnspython>=2.6,<3"]
keywords = ["email", "verification", "dns", "smtp", "deliverability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Email",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
email-verifier = "email_verifier.cli:main"

[tool.setuptools.packages.find]
include = ["email_verifier*"]

[tool.setuptools.package-data]
email_verifier = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
